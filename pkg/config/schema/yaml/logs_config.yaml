  batch_max_concurrent_send:
    node_type: setting
    type: number
    default: 0
    tags:
    - golang_type:int
  batch_max_content_size:
    node_type: setting
    type: number
    default: 5000000
    tags:
    - golang_type:int
  batch_max_size:
    node_type: setting
