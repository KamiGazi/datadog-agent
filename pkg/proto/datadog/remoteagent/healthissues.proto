syntax = "proto3";

package datadog.remoteagent.healthissues.v1;
option go_package = "pkg/proto/pbgo/core"; // golang


service HealthIssueProvider {
  // Gets all currently active health issues of a remote agent.
  rpc GetHealthIssues(datadog.remoteagent.healthissues.v1.GetHealthIssuesRequest) returns (datadog.remoteagent.healthissues.v1.GetHealthIssuesResponse);
}

message GetHealthIssuesRequest {}

message HealthIssueReport {
  // Unique instance id, used as the store's map key in the core agent.
  string issue_id = 1;

  // Template id looked up in the core agent's issue registry.
  string issue_type = 2;

  // Reporting integration or component name.
  string source = 3;

  // Variables for filling in the issue template.
  map<string, string> context = 4;

  // Extra tags appended to the template's defaults.
  repeated string tags = 5;
}

message GetHealthIssuesResponse {
  // All currently active health issues on this remote agent.
  // An empty list means the agent is healthy (no active issues).
  repeated HealthIssueReport issues = 1;
}
